<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>WMS Login</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="admin@wms.com">
          @if (loginForm.get('email')?.hasError('email')) {
            <mat-error>Введіть коректний email</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Пароль</mat-label>
          <input matInput formControlName="password" type="password" placeholder="******">
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="full-width login-btn" 
          [disabled]="loginForm.invalid">
          Увійти
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
