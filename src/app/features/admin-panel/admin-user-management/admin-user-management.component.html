<div>
    <h2>Управління користувачами</h2>
</div>
<div class="container">
    <div class="user-management-actions">
        <button mat-raised-button color="primary">Додати</button>
        <button mat-raised-button color="accent">Змінити</button>
        <button mat-raised-button color="warn">Видалити</button>
    </div>
    <div class="user-management-list">
        <app-table [data]="users" [columns]="userManagementColumns" [rowIdKey]="rowIdKeyForUsers"></app-table>
    </div>
</div>
