<div class="alley-container">
  <div class="header">
    <button class="back-btn" (click)="backClicked.emit()">⬅ Back to Map</button>
    <h3>Alley View: {{ alleyName }}</h3>
  </div>

  <div class="alley">
    @for (floor of floors; track floor.index) {
      <div class="floor-row">
        @for (cell of floor.cells; track cell.index) {
          
          <div class="cell-box" 
              [class.highlight-green]="isSpotAvailable(floor.index, cell.index)"
              (click)="selectSpot(floor.index, cell.index)">
            
            Комірка {{ cell.index }}
            
          </div>
          
        }
      </div>
    }
  </div>
</div>
