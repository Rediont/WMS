
<div class="inventory-container">
    <h2>Inventory Management</h2>
    <mat-divider></mat-divider>
    <div class="inventory-actions">
        <button>Add New Item</button>
        <button>Delete Item</button>
    </div>

    <div class="inventory-list">
        <table>
            <thead>
                <tr>
                    <th> № </th>
                    <th> Pallet ID </th>
                    <th> Name </th>
                    <th> Alley </th>
                    <th> Cell </th>
                    <th> Pallet Type </th>
                </tr>
            </thead>
            <tbody>
                @for (item of items; track $index) {
                    <tr [routerLink]="['/inventory',1]", style="cursor: pointer;">
                        <td>{{$index + 1}}</td>
                        <td>{{item}}</td>
                        <td>{{item}}</td>
                        <td>{{item}}</td>
                        <td>{{item}}</td>
                        <td>{{item}}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
