<form [formGroup]="filterForm" class="filter-wrapper">
  
  <div class="filter-content">
    @for (field of fields; track field.key) {
      
      @if (field.type === 'text' || field.type === 'number') {
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>{{ field.label }}</mat-label>
          <input matInput [type]="field.type" [formControlName]="field.key">
        </mat-form-field>
      }

      @if (field.type === 'select') {
        <div class="checkbox-group-wrapper">
          <label class="checkbox-group-label">{{ field.label }}</label>
          <div class="checkbox-list">
            @for (opt of field.options; track opt.value) {
              <mat-checkbox 
                color="primary"
                [checked]="isChecked(field.key, opt.value)"
                (change)="toggleCheckbox(field.key, opt.value, $event.checked)">
                {{ opt.display }}
              </mat-checkbox>
            }
          </div>
        </div>
      }

      @if (field.type === 'date-range') {
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>{{ field.label }}</mat-label>
          <mat-date-range-input [rangePicker]="rangePicker" [formGroup]="getAsFormGroup(field.key)">
            <input matStartDate formControlName="start" placeholder="Start date">
            <input matEndDate formControlName="end" placeholder="End date">
          </mat-date-range-input>
          <mat-datepicker-toggle matIconSuffix [for]="rangePicker"></mat-datepicker-toggle>
          <mat-date-range-picker #rangePicker></mat-date-range-picker>
        </mat-form-field>
      }

    }
  </div> <div class="filter-actions">
    <button mat-raised-button color="primary" type="button" (click)="applyFilters()">
      Apply Filters
    </button>
    <button mat-raised-button color="warn" type="button" (click)="resetFilters()">
      Reset All
    </button>
  </div>
</form>
